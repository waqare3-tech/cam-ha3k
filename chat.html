<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp - Chat Room</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="user-info">
                <div class="avatar">
                    <span id="currentUsername"></span>
                </div>
                <h3 id="usernameDisplay"></h3>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
            
            <div class="users-list">
                <h4>Online Users (<span id="userCount">0</span>)</h4>
                <div id="onlineUsers" class="users-grid"></div>
            </div>
        </div>
        
        <!-- Main Chat Area -->
        <div class="main-chat">
            <div class="chat-header">
                <h2 id="chatTitle">Public Chat</h2>
                <div class="chat-status" id="chatStatus">
                    <span class="status-dot"></span>
                    <span>Connected</span>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div id="messagesList" class="messages-list"></div>
            </div>
            
            <div class="message-input-container">
                <div class="message-input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="Type your message here..." 
                        rows="1"
                        maxlength="500"
                    ></textarea>
                    <button id="sendBtn" class="btn-send">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-hint" id="inputHint">Public chat - everyone can see</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
